# GitHub Light color palette for tmux (matches nvim colorscheme github_light from
# projekt0n/github-nvim-theme)

# ── Accent colors ─────────────────────────────────────────────
set -g @red          "#cf222e"
set -g @red_bright   "#a40e26"

set -g @green        "#116329"
set -g @green_bright "#1a7f37"

set -g @yellow        "#4d2d00"
set -g @yellow_bright "#633c01"

set -g @blue        "#0969da"
set -g @blue_bright "#218bff"

set -g @purple        "#8250df"
set -g @purple_bright "#a475f9"

set -g @aqua        "#1b7c83"
set -g @aqua_bright "#3192aa"

set -g @orange        "#953800"
set -g @orange_bright "#bc4c00"

set -g @gray        "#6e7781"
set -g @gray_bright "#57606a"

# ── Background ramp ───────────────────────────────────────────
set -g @bg0_h "#ffffff"   # hard/brightest bg
set -g @bg0_s "#f1f1f2"   # soft bg
set -g @bg0   "#ffffff"   # default bg
set -g @bg1   "#f6f8fa"   # status bar bg
set -g @bg2   "#e7eaf0"   # inactive pane border
set -g @bg3   "#57606a"   # comment / muted
set -g @bg4   "#dae9f9"   # selection bg

# ── Foreground ───────────────────────────────────────────
set -g @fg0 "#1f2328"   # brightest fg
set -g @fg  "#1f2328"   # default fg  (alias for fg1)
set -g @fg1 "#1f2328"
set -g @fg2 "#32383f"
set -g @fg3 "#6e7781"
set -g @fg4 "#57606a"   # dimmed fg / active border
