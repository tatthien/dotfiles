# Catppuccin Latte color palette for tmux (ported from
# https://github.com/catppuccin/tmux/blob/main/themes/catppuccin_latte_tmux.conf)

# ── Accent colors ─────────────────────────────────────────────
set -g @red          "#d20f39"
set -g @red_bright   "#e64553"

set -g @green        "#40a02b"
set -g @green_bright "#179299"

set -g @yellow        "#df8e1d"
set -g @yellow_bright "#fe640b"

set -g @blue        "#1e66f5"
set -g @blue_bright "#209fb5"

set -g @purple        "#8839ef"
set -g @purple_bright "#ea76cb"

set -g @aqua        "#04a5e5"
set -g @aqua_bright "#7287fd"

set -g @orange        "#fe640b"
set -g @orange_bright "#dd7878"

set -g @gray        "#6c6f85"
set -g @gray_bright "#5c5f77"

# ── Background ramp ───────────────────────────────────────────
set -g @bg0_h "#ffffff"   # hard/brightest bg
set -g @bg0_s "#eff1f5"   # soft bg
set -g @bg0   "#eff1f5"   # default bg
set -g @bg1   "#e6e9ef"   # status bar bg
set -g @bg2   "#dce0e8"   # inactive pane border
set -g @bg3   "#9ca0b0"   # comment / muted
set -g @bg4   "#bcc0cc"   # selection bg

# ── Foreground ───────────────────────────────────────────
set -g @fg0 "#4c4f69"   # brightest fg
set -g @fg  "#4c4f69"   # default fg  (alias for fg1)
set -g @fg1 "#4c4f69"
set -g @fg2 "#5c5f77"
set -g @fg3 "#6c6f85"
set -g @fg4 "#8c8fa1"   # dimmed fg / active border
