# GitHub Light High Contrast color palette for tmux (matches nvim colorscheme
# github_light_high_contrast from projekt0n/github-nvim-theme)

# ── Accent colors ─────────────────────────────────────────────
set -g @red          "#a0111f"
set -g @red_bright   "#86061d"

set -g @green        "#024c1a"
set -g @green_bright "#055d20"

set -g @yellow        "#3f2200"
set -g @yellow_bright "#4e2c00"

set -g @blue        "#0349b4"
set -g @blue_bright "#1168e3"

set -g @purple        "#622cbc"
set -g @purple_bright "#844ae7"

set -g @aqua        "#1b7c83"
set -g @aqua_bright "#3192aa"

set -g @orange        "#702c00"
set -g @orange_bright "#744500"

set -g @gray        "#66707b"
set -g @gray_bright "#4b535d"

# ── Background ramp ───────────────────────────────────────────
set -g @bg0_h "#ffffff"   # hard/brightest bg
set -g @bg0_s "#f0f1f2"   # soft bg
set -g @bg0   "#ffffff"   # default bg
set -g @bg1   "#f0f1f2"   # status bar bg
set -g @bg2   "#e7ecf0"   # inactive pane border
set -g @bg3   "#4b535d"   # comment / muted
set -g @bg4   "#cddbf0"   # selection bg

# ── Foreground ───────────────────────────────────────────
set -g @fg0 "#010409"   # brightest fg
set -g @fg  "#010409"   # default fg  (alias for fg1)
set -g @fg1 "#010409"
set -g @fg2 "#20252c"
set -g @fg3 "#66707b"
set -g @fg4 "#4b535d"   # dimmed fg / active border
