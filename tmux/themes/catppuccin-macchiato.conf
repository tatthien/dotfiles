# Catppuccin Macchiato color palette for tmux (ported from
# https://github.com/catppuccin/tmux/blob/main/themes/catppuccin_macchiato_tmux.conf)

# ── Accent colors ─────────────────────────────────────────────
set -g @red          "#ed8796"
set -g @red_bright   "#ee99a0"

set -g @green        "#a6da95"
set -g @green_bright "#8bd5ca"

set -g @yellow        "#eed49f"
set -g @yellow_bright "#f5a97f"

set -g @blue        "#8aadf4"
set -g @blue_bright "#7dc4e4"

set -g @purple        "#c6a0f6"
set -g @purple_bright "#f5bde6"

set -g @aqua        "#91d7e3"
set -g @aqua_bright "#b7bdf8"

set -g @orange        "#f5a97f"
set -g @orange_bright "#f0c6c6"

set -g @gray        "#a5adcb"
set -g @gray_bright "#b8c0e0"

# ── Background ramp ───────────────────────────────────────────
set -g @bg0_h "#181926"   # hard/darkest bg
set -g @bg0_s "#1e2030"   # soft bg
set -g @bg0   "#24273a"   # default bg
set -g @bg1   "#1e2030"   # status bar bg
set -g @bg2   "#363a4f"   # inactive pane border
set -g @bg3   "#5b6078"   # comment / muted
set -g @bg4   "#494d64"   # selection bg

# ── Foreground ───────────────────────────────────────────
set -g @fg0 "#cad3f5"   # brightest fg
set -g @fg  "#cad3f5"   # default fg  (alias for fg1)
set -g @fg1 "#cad3f5"
set -g @fg2 "#b8c0e0"
set -g @fg3 "#a5adcb"
set -g @fg4 "#8087a2"   # dimmed fg / active border
