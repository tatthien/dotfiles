# Vitesse Light color palette for tmux (ported from antfu/vscode-theme-vitesse)

# ── Accent colors ─────────────────────────────────────────────
set -g @red          "#ab5959"
set -g @red_bright   "#b31d28"

set -g @green        "#1e754f"
set -g @green_bright "#59873a"

set -g @yellow        "#bda437"
set -g @yellow_bright "#998418"

set -g @blue        "#296aa3"
set -g @blue_bright "#2e808f"

set -g @purple        "#a13865"
set -g @purple_bright "#5a6aa6"

set -g @aqua        "#2993a3"
set -g @aqua_bright "#2f798a"

set -g @orange        "#a65e2b"
set -g @orange_bright "#ab5e3f"

set -g @gray        "#6a737d"
set -g @gray_bright "#4e4f47"

# ── Background ramp ───────────────────────────────────────────
set -g @bg0_h "#ffffff"   # hard/brightest bg
set -g @bg0_s "#f0f0f0"   # soft bg
set -g @bg0   "#f7f7f7"   # default bg
set -g @bg1   "#f0f0f0"   # status bar bg
set -g @bg2   "#e1e4e8"   # inactive pane border
set -g @bg3   "#c1c1bf"   # comment / muted
set -g @bg4   "#a0ada0"   # selection bg

# ── Foreground ───────────────────────────────────────────
set -g @fg0 "#24292e"   # brightest fg
set -g @fg  "#393a34"   # default fg  (alias for fg1)
set -g @fg1 "#393a34"
set -g @fg2 "#4e4f47"
set -g @fg3 "#6a737d"
set -g @fg4 "#8f948c"   # dimmed fg / active border
